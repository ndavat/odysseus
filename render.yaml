# render.yaml — Render.com Blueprint for Odysseus (free / demo tier).
#
# Deploys a single Docker web service from the repo's Dockerfile. Use
# https://render.com/docs/blueprint-spec as the schema reference; this file
# keeps things explicit and minimal so it's easy to audit before "Apply".
#
# Free-plan realities for this service (as of 2026 — see render.com/docs/free):
#   - NO persistent disk. /app/data is ephemeral: every redeploy, restart,
#     or 15-min idle spin-down wipes SQLite (app.db), auth.json, settings,
#     sessions, memory, presets, uploads, generated images, scheduled tasks.
#     Demo / preview only.
#   - 512 MB RAM cap. ChromaDB sidecar dropped (chroma lives in /app/data,
#     which is ephemeral anyway — saving ~150-200 MB is the priority).
#   - 15-min idle spin-down + ~1 min cold start on return.
#   - No zero-downtime deploys.
#   - 750 instance-hours / month included in workspace (spun-down services
#     do not consume these hours); exhausted workspace suspends all free
#     services until the next calendar month.
#
# Required env to set in the Render dashboard BEFORE first deploy
# (the entries marked `sync: false` here, which Render keeps secret):
#   - ODYSSEUS_ADMIN_USER       (e.g. "admin")
#   - ODYSSEUS_ADMIN_PASSWORD   (≥ PASSWORD_MIN_LENGTH=8 chars, prefer 24+)
#   - OPENAI_API_KEY            (any OpenAI-compatible key; OpenRouter works)
#   - ALLOWED_ORIGINS           (use https://<service>.onrender.com after first build)
#
# INSTALL_OPTIONAL is set to "false" so the heavier optional deps (chromadb,
# faster-whisper, ddgs, PyMuPDF, markitdown) are NOT installed at image
# build time. The image stays small (~150 MB) for fast cold starts and the
# 512 MB RAM cap. render-start.sh seeds /app/data/settings.json with
# search_provider=duckduckgo on every fresh boot (the file gets wiped on
# every spin-down, so we re-seed idempotently).

services:
  - type: web
    name: odysseus
    runtime: docker
    plan: free
    region: oregon
    rootDir: .
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # NOTE: do NOT add `buildArgs:` here. Render's Blueprint schema for the
    # `file.Service` type rejects it. Instead envVars entries are
    # auto-translated into --build-arg at image-build time; INSTALL_OPTIONAL
    # is declared in the envVars list below and consumed by the Dockerfile's
    # ARG INSTALL_OPTIONAL=false default. Source:
    # https://render.com/docs/docker#docker-specific-features
    # Repo Dockerfile CMD is hardcoded to --port 7000. Render sets
    # $PORT=10000 and expects us to bind there. `dockerCommand` overrides
    # the CMD but NOT the ENTRYPOINT — docker/entrypoint.sh still runs
    # setup.py and repairs ownership as the odysseus user.
    dockerCommand: sh /app/render-start.sh
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # ----- build-time flag (Render auto-translates envVars → --build-arg) -----
      # Per https://render.com/docs/docker#docker-specific-features, envVars
      # entries are automatically passed to `docker build` as --build-arg.
      - key: INSTALL_OPTIONAL
        value: "false"

      # ----- network / bind -----
      - key: APP_BIND
        value: 0.0.0.0
      # PORT is set by Render automatically; render-start.sh reads it.

      # ----- container user (matches entrypoint.sh PUID/PGID; 1000 = odysseus) -----
      - key: PUID
        value: "1000"
      - key: PGID
        value: "1000"

      # ----- auth / security -----
      - key: AUTH_ENABLED
        value: "true"
      - key: LOCALHOST_BYPASS
        value: "false"
      - key: SECURE_COOKIES
        value: "true"          # Render terminates TLS; cookies go over HTTPS
      - key: REQUEST_HARD_TIMEOUT
        value: "60"

      # ----- ephemeral data dir (free plan = wiped on every spin-down) -----
      - key: ODYSSEUS_DATA_DIR
        value: /app/data
      - key: DATABASE_URL
        value: sqlite:////app/data/app.db

      # ----- background workers off (single-instance ephemeral app) -----
      - key: ODYSSEUS_INPROCESS_POLLERS
        value: "0"
      - key: ODYSSEUS_INPROCESS_TASKS
        value: "0"

      # ----- per-feature upload caps (defaults exposed as env for visibility) -----
      - key: ODYSSEUS_CHAT_UPLOAD_MAX_BYTES
        value: "10485760"
      - key: ODYSSEUS_GALLERY_UPLOAD_MAX_BYTES
        value: "104857600"
      - key: ODYSSEUS_GALLERY_TRANSFORM_UPLOAD_MAX_BYTES
        value: "26214400"
      - key: ODYSSEUS_MEMORY_IMPORT_MAX_BYTES
        value: "10485760"
      - key: ODYSSEUS_PERSONAL_UPLOAD_MAX_BYTES
        value: "26214400"
      - key: ODYSSEUS_EMAIL_COMPOSE_UPLOAD_MAX_BYTES
        value: "26214400"
      - key: ODYSSEUS_STT_MAX_AUDIO_BYTES
        value: "26214400"
      - key: ODYSSEUS_ICS_MAX_BYTES
        value: "10485760"

      # ----- secrets (Render dashboard-only) -----
      - key: ODYSSEUS_ADMIN_USER
        sync: false
      - key: ODYSSEUS_ADMIN_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false

# `disk:` block intentionally omitted — Render's Blueprint validator rejects
# persistent disks on the free tier. /app/data lives on the container's
# writable ephemeral layer instead, so all state is wiped on every
# spin-down / redeploy. Best suited for ephemeral demos / previews.
#
# No `databases:` block either — SQLite on /app/data is sufficient.
